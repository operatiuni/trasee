plugins {
    id 'com.android.application'
}

def versiune = (project.findProperty('versiuneCod') ?: '1').toInteger()

android {
    namespace 'ro.bigchef.traseuoptim'
    compileSdk 34

    defaultConfig {
        applicationId 'ro.bigchef.traseuoptim'
        minSdk 26
        targetSdk 34
        versionCode versiune
        versionName "1." + versiune
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
