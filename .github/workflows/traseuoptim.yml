name: TraseuOptim APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/traseuoptim.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construieste APK
        run: gradle -p android assembleDebug -PversiuneCod=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publica APK pe pagina
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TraseuOptim.apk
          echo "1.${{ github.run_number }}" > TraseuOptim-versiune.txt
          git config user.name "TraseuOptim build"
          git config user.email "build@users.noreply.github.com"
          git add TraseuOptim.apk TraseuOptim-versiune.txt
          git commit -m "TraseuOptim APK 1.${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase
          git push
